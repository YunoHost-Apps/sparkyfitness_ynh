#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "sparkyfitness"
name = "SparkyFitness"
description.en = "Track food, fitness, water, and health"
description.fr = "Suivez votre alimentation, votre forme et votre santé"

version = "1.9.0~ynh1"

maintainers = ["Thovi98"]

[upstream]
license = "PolyForm-Noncommercial-1.0.0" # Not exactly but the most relative
admindoc = "https://codewithcj.github.io/SparkyFitness"
code = "https://github.com/CodeWithCJ/SparkyFitness"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]

    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/CodeWithCJ/SparkyFitness/releases/download/v1.9.0/SparkyFitness.tar.gz"
    sha256 = "3040feffc8b504d15aa8765b0f1c95f33d0e638de97d9c7274a8fb8853a8e1a7"
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset = ".*.tar.gz"

    [resources.sources.temp]
    url = "https://github.com/CodeWithCJ/SparkyFitness/archive/refs/tags/v1.9.0.tar.gz"
    sha256 = "3e04b4df267541a67329ed5b3274c5a6bf6983f1247f31d79d5cdbccdd55bfa9"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    api.url = "/api"
    api.auth_header = false
    api.allowed = "visitors"
    api.show_tile = false
    api.protected = true

    [resources.ports]
    main.default = 3010
    garmin.default = 8000

    [resources.apt]
    packages = "postgresql, postgresql-contrib, python3-venv"

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "24"
